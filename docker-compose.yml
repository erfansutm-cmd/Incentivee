# ─────────────────────────────────────────────────────────────
#  DEVELOPMENT
#  Run:  docker compose up --build
#  - FastAPI: uvicorn with --reload, source mounted as a volume
#  - Vue: Vite dev server with HMR, source mounted as a volume
#  - Frontend (Vite) proxies /api -> backend:8000
# ─────────────────────────────────────────────────────────────
services:
  backend:
    build:
      context: ./backend
      target: dev
    image: incentive-backend:dev
    container_name: incentive-backend-dev
    volumes:
      - ./backend:/backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      # Database (values come from the root .env file, with defaults)
      DB_HOST: ${DB_HOST:-172.21.41.75}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-erfan.mohamadi}
      DB_PASSWORD: ${DB_PASSWORD:-}
      DB_NAME: ${DB_NAME:-incentive}
      # If MySQL runs on the Windows host itself, set DB_HOST=host.docker.internal
    extra_hosts:
      # lets the container reach services on the Windows/macOS host
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      target: dev
    image: incentive-frontend:dev
    container_name: incentive-frontend-dev
    volumes:
      - ./frontend:/frontend
      # Anonymous volume keeps the container's node_modules instead of
      # shadowing it with the host folder
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      NODE_ENV: development
    depends_on:
      - backend
    restart: unless-stopped
